# Claude Code -> LiteLLM -> AWS Bedrock -> Anthropic
# with the Akto LiteLLM connector attached for guardrails + ingestion.
#
# Sources:
#   litellm_settings block ....... Akto docs, "Update LiteLLM Configuration"
#   guardrails (bedrock) ......... LiteLLM docs, "Bedrock Guardrails"
#   general_settings.master_key ... LiteLLM docs, proxy config

model_list:
  # ---- AWS Bedrock (target architecture: Claude Code -> LiteLLM -> Bedrock) ----
  # ap-south-1 has no regional Anthropic capacity for current models, so these
  # use the cross-region inference profiles (global.*), invoked from ap-south-1.
  # Verified with bedrock-runtime converse before wiring in.
  - model_name: bedrock-claude-sonnet-4-5
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_session_token: os.environ/AWS_SESSION_TOKEN
  - model_name: bedrock-claude-haiku-4-5
    litellm_params:
      model: bedrock/global.anthropic.claude-haiku-4-5-20251001-v1:0
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_session_token: os.environ/AWS_SESSION_TOKEN

# AWS Bedrock guardrail, per LiteLLM docs "Bedrock Guardrails".
# Layered design: Bedrock owns toxicity + PII, Akto owns prompt injection.
# The guardrail's PROMPT_ATTACK filter is deliberately set to NONE in AWS so the
# two layers don't overlap and each block is attributable to one owner.
guardrails:
  - guardrail_name: bedrock-toxicity-pii
    litellm_params:
      guardrail: bedrock
      mode: pre_call
      # akto-litellm-layered. Purpose-built for this flow so the shared
      # guardrail-demo (5g8brbmgvmx1 v3) stays untouched. Difference: EMAIL is
      # ANONYMIZE rather than BLOCK, because coding agents inject the operator's
      # email into a <system-reminder> on every request, which made EMAIL=BLOCK
      # reject 100% of benign Claude Code traffic. SSN and card stay BLOCK.
      guardrailIdentifier: cq066lrgt30t
      guardrailVersion: "1"
      aws_region_name: os.environ/AWS_REGION_NAME
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_session_token: os.environ/AWS_SESSION_TOKEN
      default_on: true
      # Without this, Bedrock evaluates the WHOLE conversation on every turn, so
      # one PII message poisons the rest of the session - every later benign turn
      # is re-blocked on the old SSN. Sending only the latest user turn matches
      # what the Akto layer evaluates, so the two layers stay symmetric.
      # Flagged experimental in LiteLLM's Bedrock guardrail docs.
      experimental_use_latest_role_message_only: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

# Exactly the block from Akto's LiteLLM connector doc.
litellm_settings:
  callbacks: [custom_hooks.proxy_handler_instance]
  drop_params: true
  set_verbose: false
  request_timeout: 600
  num_retries: 2

router_settings:
  cooldown_time: 0
